[workspace]
resolver = "2"
members = [
    "rust/guest-provider",
    "rust/wasmtime",
    "conformance/server",
    "conformance/guest-ct",
    "conformance/driver-ct",
    "examples/echo-demo",
    "examples/wasmtime-demo",
]
# The native (host-target) crates: bare `cargo clippy` / `cargo test` cover
# exactly this set. The wasm-only crates (conformance/guest-ct, echo-demo)
# build for their wasm targets through the justfile recipes.
default-members = [
    "rust/guest-provider",
    "rust/wasmtime",
    "conformance/server",
    "conformance/driver-ct",
    "examples/wasmtime-demo",
]

[workspace.dependencies]
# The component-test harness, rev-pinned (no registry release yet).
# One rev everywhere: these two entries, the CLI install
# (conformance/driver-ct/justfile reads the rev back out of Cargo.lock),
# and the @polymorph/component-test-js pin in
# conformance/driver-ct/jco/package.json. Bump all together, then
# `cargo update component-test-sdk component-test-runner` and
# `pnpm --dir conformance/driver-ct/jco install`.
component-test-sdk = { git = "https://github.com/polymorph-components/polymorph-test", rev = "b80c13be7b9fecfed8ec10a91d23d8cf8349defe" }
component-test-runner = { git = "https://github.com/polymorph-components/polymorph-test", rev = "b80c13be7b9fecfed8ec10a91d23d8cf8349defe" }
anyhow = "1"
bytes = "1"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
toml = "0.8"
wasmtime = { version = "47", features = [
    "component-model",
    "component-model-async",
    "async",
    "runtime",
] }
wit-bindgen = "0.59"
