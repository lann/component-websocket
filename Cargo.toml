[workspace]
resolver = "2"
members = [
    "rust/wasmtime",
    "conformance/server",
    "conformance/guest-ct",
    "conformance/driver-ct",
    "examples/echo-demo",
    "examples/wasmtime-demo",
]
# The native (host-target) crates: bare `cargo clippy` / `cargo test` cover
# exactly this set. The wasm-only crates (conformance/guest-ct, echo-demo)
# build for their wasm targets through the justfile recipes.
default-members = [
    "rust/wasmtime",
    "conformance/server",
    "conformance/driver-ct",
    "examples/wasmtime-demo",
]

[workspace.dependencies]
# The component-test harness, rev-pinned (no registry release yet).
# One rev everywhere: these two entries, the CLI install
# (conformance/driver-ct/justfile reads the rev back out of Cargo.lock),
# and the @lann/component-test-js npm pin in
# conformance/driver-ct/jco/package.json. Bump all together, then
# `cargo update component-test-sdk component-test-runner` and
# `npm --prefix conformance/driver-ct/jco install`.
component-test-sdk = { git = "https://github.com/lann/component-test", rev = "135a395c54fb75e6989c0e4047fd6f2f0db2c62a" }
component-test-runner = { git = "https://github.com/lann/component-test", rev = "135a395c54fb75e6989c0e4047fd6f2f0db2c62a" }
anyhow = "1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
toml = "0.8"
wasmtime = { version = "47", features = [
    "component-model",
    "component-model-async",
    "async",
    "runtime",
] }
wit-bindgen = "0.59"
