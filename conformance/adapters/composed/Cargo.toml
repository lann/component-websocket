[package]
name = "conformance-adapter-composed"
version = "0.1.0"
edition = "2021"
publish = false
description = "Conformance adapter for the composed in-guest provider target (WebSocket over wasi:sockets)"

[dependencies]
anyhow = { workspace = true }
conformance-adapter-common = { path = "../common" }
conformance-echod = { path = "../../server" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
