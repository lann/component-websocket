[package]
name = "conformance-ct-driver"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-embed driver for the component-test conformance suite: wasmtime + the native tokio-tungstenite host, in-process echo server, store environment carrying the suite bounds."

[[bin]]
name = "ct-driver"
path = "src/main.rs"

[dependencies]
# The component-test host-embed runner (rev-pinned git dep; see
# [workspace.dependencies]).
component-test-runner = { workspace = true }
wasmtime-websocket = { path = "../../rust/wasmtime" }
conformance-echod = { path = "../server" }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
wasmtime = { workspace = true }
wasmtime-wasi = "47"
