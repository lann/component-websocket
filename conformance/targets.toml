# Per-target capability facts for the conformance matrix.
#
# Every conformance target has a `[target.<id>]` table — an empty table is
# load-bearing: it registers the target so the matrix gets a row, and a
# target that stops reporting shows as visibly all-missing instead of
# vanishing.
#
# Declarations (all optional):
#
#   [[target.<id>.unsupported]]     # tag-scoped: the guest's `skipped`
#   tag = "<tag from tests.toml>"   # results for tests carrying this tag
#   reason = "<why, mandatory>"     # classify as SKIP-UNSUPPORTED
#
#   [[target.<id>.expected-fail]]   # test-scoped: a known failure with a
#   test = "<test id>"              # tracking issue. A passing
#   reason = "<why, mandatory>"     # expected-fail is UNEXPECTED-PASS and
#   tracking = "<issue url>"        # fails the run, forcing cleanup here.
#
# An undeclared runtime divergence may not be recorded here at all — it is
# a defect to resolve, not a fact to accumulate.

[target.wasmtime]

[target.jco-node]

[target.jco-browser]
