# Pinned so builds are reproducible across contributors and CI. Bump this
# deliberately rather than tracking floating `stable`.
[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
# wasm32-unknown-unknown: example guests that import/export only custom
#   WIT (componentized with `wasm-tools component new`).
# wasm32-wasip2: the conformance suite (conformance/guest-ct); also the
#   target for the in-guest provider (not yet built).
targets = ["wasm32-unknown-unknown", "wasm32-wasip2"]
